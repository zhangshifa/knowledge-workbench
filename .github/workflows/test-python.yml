name: Python Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'server_py/**'
      - 'web/**'
      - '.github/workflows/test-python.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests (stdlib only)
        working-directory: server_py
        run: python -m unittest discover -s tests -v

      - name: Verify zero third-party dependency
        working-directory: server_py
        run: |
          python - <<'PY'
          import subprocess, sys, os
          # 隐藏 cryptography，验证纯标准库回退路径可用
          code = (
              "import sys; sys.path.insert(0, '.');"
              "import kb.core as c; c._HAS_AESGCM = False;"
              "print(c.crypto_mode());"
              "enc = c.encrypt('probe-token', '.');"
              "assert c.decrypt(enc, '.') == 'probe-token';"
              "print('纯标准库加解密 OK')"
          )
          env = dict(os.environ, PYTHONDONTWRITEBYTECODE='1')
          subprocess.run([sys.executable, '-c', code], check=True, env=env, cwd='.')
          PY
